name: CI/CD Pipeline - Docker Hub & GCP VM Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure direct pushes to main deploy sequentially without collision
concurrency:
  group: production-deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-frontend:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run vitest unit tests
        working-directory: frontend
        run: npm test

      - name: Type check and build
        working-directory: frontend
        run: npm run build

  test-backend:
    name: Test Backend API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "./backend[dev]"

      - name: Run code quality checks (ruff & mypy)
        run: |
          ruff check backend
          ruff format --check backend
          mypy backend/app

      - name: Run pytest test suite
        run: pytest backend

  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    environment: Production
    needs: [test-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      configured: ${{ steps.check-creds.outputs.configured }}
      docker_user: ${{ steps.check-creds.outputs.docker_user }}
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: check-creds
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_PASS" ]; then
            echo "::warning::Docker Hub secrets (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN) are missing. Skipping image push."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            CLEAN_USER=$(echo -n "$DOCKER_USER" | tr -d '\r\n\t "' | tr '[:upper:]' '[:lower:]')
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "docker_user=${CLEAN_USER}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check-creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check-creds.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.check-creds.outputs.docker_user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check-creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.check-creds.outputs.docker_user }}/windwatch:latest
            ${{ steps.check-creds.outputs.docker_user }}/windwatch:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vm:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    environment: Production
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build-and-push.outputs.configured == 'true'

    steps:
      - name: Check VM SSH credentials
        id: check-ssh
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -z "$VM_HOST" ] || [ -z "$VM_USER" ] || [ -z "$VM_SSH_KEY" ]; then
            echo "::warning::VM SSH credentials (VM_HOST, VM_USER, VM_SSH_KEY) are missing. Skipping VM deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check-ssh.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Deploy container to GCP VM via SSH
        if: steps.check-ssh.outputs.configured == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_KEY: ${{ secrets.VM_SSH_KEY }}
          TARGET_IMAGE: "${{ needs.build-and-push.outputs.docker_user }}/windwatch:${{ needs.build-and-push.outputs.image_tag }}"
        run: |
          mkdir -p ~/.ssh
          echo "$VM_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${VM_USER}@${VM_HOST}" "bash -s -- '$TARGET_IMAGE'" < scripts/deploy.sh

